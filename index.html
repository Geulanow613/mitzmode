<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mitz Mode</title>
    <base href="/mitzmode/">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            /* Let Compose receive pan/wheel; avoid browser hijacking gestures. */
            touch-action: none;
        }
    </style>
</head>
<body>
    <script type="application/javascript" src="mitzmodeWeb.js"></script>
</body>
</html>
